<body class="text-center bg-dark text-light">
<header>
    <h1 class="p-5 bg-info bg-gradient">HW 3: Dex</h1>
</header>
<main>
    <div class="position-relative bg-dark bg-gradient text-start text-wrap mx-auto p-4" style="width: 600px; border-radius: 25px">
        <div class="text-center">
            <button id="pkmnButton" type="button" class="btn btn-outline-light">Look for a Pokémon!</button>
        </div><br>
        <form id="pkmnForm" action="nickname_complete.html">
            <div id="pkmnBlock">
                <div class="row g-0 position-relative">
                    <div class="col-md-4 img-fluid rounded bg-white" style="width: 150px">
                        <img src="" id=pkmnSprite alt="Random Pokémon sprite image." width="150px" style="position: relative; top:40px;">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body rounded bg-white" style="margin-left: 30px; margin-bottom: 10px;">
                            <b>Dex #</b><span id="pkmnNum"></span><br>
                            <b>Species: </b><span id="pkmnName"></span><br>
                            <b>Type(s): </b><span id="pkmnTypes"></span><br>
                            <em id="announcement"></em>
                        </div>
                        <div class="card-body rounded bg-white" style="margin-left: 30px;">
                            <b>Nickname: </b><label><input type="text" id="nickname"></label>
                            <p id="nicknameError" class="bg-danger text-white"></p>
                        </div>
                    </div>
                </div>
            </div><br>
            <div class="text-center">
<!--                Nickname: <label><input type="text" id="nickname"></label>-->
<!--                <p id="nicknameError" class="bg-danger text-white"></p>-->
            </div><br>
            <div class="text-center">
                <input type="submit" class="btn btn-outline-light" value="Choose this Pokémon!">
            </div>
        </form>
        <script src="js/dex.js"></script>
    </div>
</main>
