<body class="text-center bg-dark text-light">
<header>
    <h1 class="p-5 bg-info bg-gradient">HW 3: Dex</h1>
</header>
<main>
    <div class="position-relative bg-dark bg-gradient text-start text-wrap mx-auto p-4" style="width: 400px; border-radius: 25px">
        <div class="text-center">
            <button id="pkmnButton" type="button" class="btn btn-outline-light">Look for a Pokemon!</button>
        </div><br>
        <form id="pkmnForm" action="nickname_complete.html">
            <div class="d-flex justify-content-center" id="pkmnBlock">
                <img src="" id=pkmnSprite alt="Random Pokemon sprite image.">
                <div>
                    Dex #<span id="pkmnNum"></span><br>
                    Species: <span id="pkmnName"></span><br> <!-- name: "wormadam" https://pokeapi.co/api/v2/pokemon/{id or name}/ -->
                    Type(s): <span id="pkmnTypes"></span><br> <!-- types: [] https://pokeapi.co/api/v2/pokemon/{id or name}/ -->
                </div>
            </div><br>
            <div class="text-center">
                Nickname: <label><input type="text" id="nickname"></label>
                <h3 id="nicknameError" class="bg-danger text-white"></h3>
            </div><br>
            <div class="text-center">
                <input type="submit" value="Choose this Pokemon!">
            </div>
        </form>
        <script src="js/dex.js"></script>
    </div>
</main>
