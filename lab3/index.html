<body class="text-center bg-dark text-light">
<header>
    <h1 class="p-5 bg-info bg-gradient">Lab 3: Sign Up Page</h1>
</header>
<main>
    <div class="position-relative bg-dark bg-gradient text-start text-wrap mx-auto p-4" style="width: 400px; border-radius: 25px">
        <form id="signupForm" action="form_complete.html">
            <div class="d-flex flex-column justify-content-center">
                First Name: <label><input type="text" name="fName"></label>
                Last Name: <label><input type="text" name="lName"></label>
            </div><br>
            <div class="d-inline-flex flex-column align-self-auto">
                Gender:<br>
                <label><input type="radio" name="gender" value="m"> Male</label>
                <label><input type="radio" name="gender" value="f"> Female</label>
                <label><input type="radio" name="gender" value="n"> Non-binary</label>
                <label><input type="radio" name="gender" value="p"> Prefer not to say</label>
            </div><hr>
            <div class="d-flex flex-column justify-content-center">
                Zip Code: <label for="zip"><input type="text" id="zip" name="zip"></label>
            </div>
            <div>
                City: <span id="city"></span><br>
                Latitude: <span id="latitude"></span><br>
                Longitude: <span id="longitude"></span>
            </div><br>
            <div class="d-flex flex-column justify-content-center">
                State: <label for="state"><select id="state" name="state">
                <option>Select One</option>
                <option value="ca">California</option>
                <option value="ny">New York</option>
                <option value="tx">Texas</option>
                </select></label>
            </div>
            <div class="d-flex flex-column justify-content-center">
                Select a County: <label for="county"><select id="county"></select></label>
            </div><hr>
            <div class="d-flex flex-column justify-content-center">
                Desired Username: <label for="username"><input type="text" id="username"></label>
                <span id="usernameError"></span>
            </div>
            <div class="d-flex flex-column justify-content-center">
                Password: <label><input type="password" id="pw"></label>
                <span id="suggestedPassword"></span>
                Type Password Again: <label><input type="password" id="retypePW"></label>
                <span id="passwordError"></span>
            </div><br><br>
            <div class="text-center">
                <input type="submit" value="Sign up!">
            </div>
        </form>
        <script src="js/sign_up.js"></script>
    </div>
</main>
